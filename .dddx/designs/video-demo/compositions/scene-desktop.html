<template id="scene-desktop-template">
  <div data-composition-id="scene-desktop" data-width="1920" data-height="1080">
    <div class="scene-content">
      <div class="bg-glow bg-glow-a"></div>
      <div class="bg-glow bg-glow-b"></div>
      <div class="ghost-label">DESIGN</div>

      <div class="url-chip">dddx.dev</div>

      <div class="browser-frame">
        <div class="browser-bar">
          <div class="browser-dots">
            <span></span><span></span><span></span>
          </div>
          <div class="browser-address">dddx.dev</div>
        </div>
        <div class="browser-viewport">
          <div class="shot-wrap" data-layout-allow-overflow>
            <img src="../assets/site-desktop.png" alt="DDDX desktop" crossorigin="anonymous" />
          </div>
        </div>
      </div>

      <div class="kicker-wrap">
        <p class="kicker" data-text="Design where you code"></p>
      </div>
    </div>

    <style>
      [data-composition-id="scene-desktop"] {
        width: 1920px;
        height: 1080px;
        background-color: #0a0c12;
        position: relative;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        color: #f5f7fa;
      }

      [data-composition-id="scene-desktop"] .scene-content {
        width: 100%;
        height: 100%;
        padding: 72px 120px 96px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        position: relative;
      }

      [data-composition-id="scene-desktop"] .bg-glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(80px);
      }

      [data-composition-id="scene-desktop"] .bg-glow-a {
        width: 520px;
        height: 520px;
        background: rgba(108, 243, 192, 0.12);
        top: -80px;
        right: 120px;
      }

      [data-composition-id="scene-desktop"] .bg-glow-b {
        width: 420px;
        height: 420px;
        background: rgba(108, 243, 192, 0.08);
        bottom: -60px;
        left: 80px;
      }

      [data-composition-id="scene-desktop"] .ghost-label {
        position: absolute;
        top: 40px;
        right: 60px;
        font-family: "Inter", sans-serif;
        font-size: 220px;
        font-weight: 700;
        letter-spacing: -0.06em;
        color: rgba(245, 247, 250, 0.04);
        pointer-events: none;
        user-select: none;
      }

      [data-composition-id="scene-desktop"] .url-chip {
        position: absolute;
        top: 48px;
        left: 120px;
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        color: #6cf3c0;
        background: rgba(22, 25, 34, 0.92);
        border: 1px solid rgba(108, 243, 192, 0.35);
        border-radius: 999px;
        padding: 10px 18px;
        letter-spacing: 0.02em;
        opacity: 0;
        z-index: 4;
      }

      [data-composition-id="scene-desktop"] .browser-frame {
        width: min(1180px, 100%);
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(108, 243, 192, 0.28);
        box-shadow:
          0 0 0 1px rgba(108, 243, 192, 0.08),
          0 30px 80px rgba(0, 0, 0, 0.45);
        background: #161922;
        z-index: 2;
      }

      [data-composition-id="scene-desktop"] .browser-bar {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        background: #12151d;
        border-bottom: 1px solid rgba(108, 243, 192, 0.12);
      }

      [data-composition-id="scene-desktop"] .browser-dots {
        display: flex;
        gap: 8px;
      }

      [data-composition-id="scene-desktop"] .browser-dots span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(139, 147, 167, 0.45);
      }

      [data-composition-id="scene-desktop"] .browser-dots span:first-child {
        background: rgba(255, 95, 86, 0.85);
      }

      [data-composition-id="scene-desktop"] .browser-dots span:nth-child(2) {
        background: rgba(255, 189, 46, 0.85);
      }

      [data-composition-id="scene-desktop"] .browser-dots span:nth-child(3) {
        background: rgba(39, 201, 63, 0.85);
      }

      [data-composition-id="scene-desktop"] .browser-address {
        flex: 1;
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: #8b93a7;
      }

      [data-composition-id="scene-desktop"] .browser-viewport {
        height: 620px;
        overflow: hidden;
        background: #ffffff;
      }

      [data-composition-id="scene-desktop"] .shot-wrap {
        width: 100%;
        height: 100%;
        overflow: hidden;
        transform-origin: center center;
      }

      [data-composition-id="scene-desktop"] .shot-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }

      [data-composition-id="scene-desktop"] .kicker-wrap {
        width: 100%;
        max-width: 1180px;
        z-index: 3;
      }

      [data-composition-id="scene-desktop"] .kicker {
        font-family: "Inter", sans-serif;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.05;
        margin: 0;
        min-height: 1.1em;
      }

      [data-composition-id="scene-desktop"] .kicker .char {
        opacity: 0;
        display: inline-block;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const BEAT = 5;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        ".browser-frame",
        { y: 36, opacity: 0, scale: 0.98 },
        { y: 0, opacity: 1, scale: 1, duration: 0.75, ease: "expo.out" },
        0.15,
      );

      tl.fromTo(
        ".shot-wrap",
        { scale: 1.04, x: 0, y: 0 },
        { scale: 1, duration: 0.7, ease: "expo.out" },
        0.25,
      );

      tl.to(".shot-wrap", { x: -18, y: -12, duration: 1.5, ease: "none" }, 1.1);

      tl.fromTo(
        ".url-chip",
        { y: -12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        1.0,
      );

      tl.fromTo(
        ".bg-glow-a",
        { scale: 0.92, opacity: 0.5 },
        { scale: 1.08, opacity: 1, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.2,
      );

      tl.fromTo(
        ".ghost-label",
        { x: 20, opacity: 0 },
        { x: 0, opacity: 1, duration: 1.2, ease: "power1.out" },
        0.35,
      );

      const kicker = document.querySelector('[data-composition-id="scene-desktop"] .kicker');
      const text = kicker.dataset.text;
      kicker.textContent = "";
      text.split("").forEach((ch) => {
        const span = document.createElement("span");
        span.className = "char";
        span.textContent = ch === " " ? "\u00a0" : ch;
        kicker.appendChild(span);
      });

      tl.fromTo(
        ".kicker .char",
        { y: 18, opacity: 0 },
        {
          y: 0,
          opacity: 1,
          duration: 0.04,
          stagger: 0.035,
          ease: "power2.out",
        },
        4.5,
      );

      window.__timelines["scene-desktop"] = tl;
    </script>
  </div>
</template>
